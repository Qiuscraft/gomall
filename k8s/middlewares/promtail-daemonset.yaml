apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
      - name: promtail
        image: grafana/promtail:2.9.2
        imagePullPolicy: IfNotPresent
        args:
        - -config.file=/etc/promtail/promtail.yml
        - -config.expand-env=true
        ports:
        - name: http
          containerPort: 9080
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
          readOnly: true
        - name: positions
          mountPath: /run/promtail
        - name: pods
          mountPath: /var/log/pods
          readOnly: true
        - name: containers
          mountPath: /var/log/containers
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: positions
        hostPath:
          path: /var/lib/promtail
          type: DirectoryOrCreate
      - name: pods
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: containers
        hostPath:
          path: /var/log/containers
          type: Directory
