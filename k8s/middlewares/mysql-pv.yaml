apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mysql-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  storageClassName: mysql-local
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/mysql-pv