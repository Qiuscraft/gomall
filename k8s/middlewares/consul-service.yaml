apiVersion: v1
kind: Service
metadata:
  name: consul
spec:
  selector:
    app: consul
  ports:
  - name: http
    port: 8500
    targetPort: http
    protocol: TCP
  - name: dns-tcp
    port: 8600
    targetPort: dns-tcp
    protocol: TCP
  - name: dns-udp
    port: 8600
    targetPort: dns-udp
    protocol: UDP
